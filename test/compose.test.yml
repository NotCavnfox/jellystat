# Ephemeral integration stand-up (app + throwaway Postgres).
services:
  app:
    image: ${IMAGE:-localbuild:ci}
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_IP=db
      - POSTGRES_PORT=5432
      - JWT_SECRET=ci-not-secret
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
  db:
    image: postgres:18.1
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 10
